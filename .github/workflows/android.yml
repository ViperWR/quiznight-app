name: Android app

on:
  push:
    branches: [main, quiz-night-app]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk quiz-night.apk
      - uses: actions/upload-artifact@v4
        with:
          name: quiz-night-apk
          path: quiz-night.apk
      # A fixed download link: …/releases/download/android-latest/quiz-night.apk
      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Quiz Night Android app (latest build)
          body: Install on Android to cast only the scoreboard to a Chromecast. Built from ${{ github.sha }}.
          prerelease: true
          files: quiz-night.apk
          target_commitish: ${{ github.sha }}
