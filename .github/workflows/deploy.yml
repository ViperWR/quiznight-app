name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # Serve the app shell for unknown paths, and stop Pages running Jekyll
      - run: |
          cp dist/quiznight-app/browser/index.html dist/quiznight-app/browser/404.html
          touch dist/quiznight-app/browser/.nojekyll
      # GitHub Pages serves the gh-pages branch (Settings > Pages > Deploy from a branch)
      - if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/quiznight-app/browser
